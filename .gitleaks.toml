title = "CD gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Historical invalid-secret test fixture"
condition = "AND"
targetRules = ["generic-api-key"]
regexTarget = "match"
regexes = ['''invalid-secret-[0-9]+''']
paths = ['''^cdx/src/transfer/transfer_test\.go$''']

[[allowlists]]
description = "Historical benchmark source checksum"
condition = "AND"
targetRules = ["generic-api-key"]
regexTarget = "secret"
regexes = ['''^(?:a63672d9fa7ad85731dd34e326ffe4ecedd2a271e460b8e94f3efdae894cb269)$''']
paths = ['''^docs/measurements/transfer\-speed\-2026\-10\-18/provenance\.json$''']

