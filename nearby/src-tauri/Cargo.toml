[package]
name = "cd-nearby"
version = "0.1.0"
description = "Private, resumable handoffs between nearby devices"
edition = "2021"
default-run = "cd-nearby"

[workspace]

[dependencies]
cd-nearby-engine = { path = "../engine" }
cd-nearby-discovery = { path = "../discovery" }
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-dialog = "2.6.0"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-opener = "2.5.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
