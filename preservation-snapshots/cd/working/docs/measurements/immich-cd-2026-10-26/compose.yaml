name: immich-cd-bench-20261026
services:
  server:
    image: ghcr.io/immich-app/immich-server:v3.3.5
    ports: ['2286:2283']
    environment:
      DB_HOSTNAME: database
      DB_USERNAME: postgres
      DB_DATABASE_NAME: immich
      DB_PASSWORD: benchmark-only-isolated
      REDIS_HOSTNAME: redis
    volumes: ['./data:/data']
    depends_on: [database, redis]
  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_PASSWORD: benchmark-only-isolated
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes: ['./postgres:/var/lib/postgresql/data']
    shm_size: 128mb
  redis:
    image: valkey/valkey:9@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
